name: Render PCB previews
on: workflow_dispatch

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad and PcbDraw
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates kicad librsvg2-bin python3-venv
          python3 -m venv --system-site-packages /tmp/pcbdraw
          /tmp/pcbdraw/bin/pip install pcbdraw==1.2.0
      - name: Render front, back, and display detail
        run: |
          export PATH="/tmp/pcbdraw/bin:$PATH"
          python .github/render-previews.py
      - uses: actions/upload-artifact@v4
        with:
          name: arkenswoop-previews
          path: images/exports/
          if-no-files-found: error
